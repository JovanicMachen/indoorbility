<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indoorbility · 3D maps</title>
<style>body{margin:0;background:#fff8f2;color:#50334d;font:17px system-ui}header{padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}button,select,input{font:inherit;padding:10px}canvas{width:100%;height:70vh;display:block;background:#f1e9e3;touch-action:none}p{padding:0 18px}#status{min-height:24px}label{display:flex;gap:8px;align-items:center}</style>
<header><h1>Indoorbility · 3D map</h1><input id="file" aria-label="Open map file" type="file" accept=".indoormap,.json"><select id="area" aria-label="Recording"></select><button id="reset">Reset view</button></header>
